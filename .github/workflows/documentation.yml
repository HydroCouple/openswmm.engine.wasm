name: Documentation

on:
  push:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "src/js/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "src/js/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the Sphinx manual with its TypeDoc API reference on every push and
  # pull request; the deploy job below publishes it from main.
  # ---------------------------------------------------------------------------
  build:
    name: Build the manual (TypeDoc + Sphinx)
    runs-on: ubuntu-latest
    steps:
      # The generated bindings are committed, so the engine submodule is not needed.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # TypeDoc runs with treatWarningsAsErrors (docs/typedoc.config.mjs).
      - name: Generate the API reference (TypeDoc)
        run: npm run docs:api

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      # -W promotes warnings to errors; --keep-going reports all of them in one pass.
      - name: Build Sphinx HTML (warnings are errors)
        run: sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html

      - name: Upload the site
        uses: actions/upload-artifact@v5
        with:
          name: documentation-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish the built manual to GitHub Pages (Pages source: GitHub Actions),
  # at https://www.hydrocouple.org/openswmm.engine.wasm/, from main only.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site
        uses: actions/download-artifact@v5
        with:
          name: documentation-html
          path: site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
