name: Lint

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "ruff.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "ruff.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # ESLint and Prettier versions are pinned exactly in package.json, so
      # CI and local lint agree byte-for-byte.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier --check
        run: npm run format:check

  python:
    name: Ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Same pin as openswmm.gymnasium and openswmm.mcp.
        run: pip install ruff==0.15.14

      - name: ruff check
        run: ruff check tools

      - name: ruff format --check
        run: ruff format --check tools
