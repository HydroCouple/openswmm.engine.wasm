name: Build & Test

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "extern/**"
      - "CMakeLists.txt"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "extern/**"
      - "CMakeLists.txt"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript type-check, unit tests (mock module), and host-shim binding check
  # (native compile of the generated static_asserts and module.cpp against the
  # engine headers — no emsdk). Runs on every supported Node major.
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript — type-check, unit tests, binding check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      # The raw layer is generated from the pinned engine headers; a stale
      # commit fails here before anything is compiled.
      - name: Generated binding drift
        run: python3 tools/gen_bindings.py --check

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Binding signature check (host compile)
        run: npm run check:bindings

  # ---------------------------------------------------------------------------
  # WASM build via Emscripten + Node smoke tests against the native references
  # ---------------------------------------------------------------------------
  wasm-build:
    name: WASM — Emscripten build & smoke tests
    runs-on: ubuntu-latest
    container:
      # Pinned to the version of the first successful local build (2026-09-06).
      image: emscripten/emsdk:6.0.9

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generated binding drift
        run: python3 tools/gen_bindings.py --check

      # The host-shim check skips struct layouts on a 64-bit host; em++ checks
      # them under the real wasm32 ABI.
      - name: Struct layouts under the wasm32 ABI
        run: |
          E=extern/openswmm.engine
          em++ -std=c++20 -fsyntax-only -DOPENSWMM_ENGINE_STATIC -Itools/host_shim \
            -I$E/include -I$E/include/openswmm/engine -I$E/include/openswmm/plugin_sdk \
            tools/host_shim/raw_check.cpp

      - name: Configure (emcmake)
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Bound compiler concurrency to avoid exhausting hosted-runner memory.
      - name: Build WASM module
        run: cmake --build build --parallel 2

      - name: Verify outputs
        run: |
          test -f dist/openswmm_engine.js   || (echo "Missing JS glue"  && exit 1)
          test -f dist/openswmm_engine.wasm || (echo "Missing WASM file" && exit 1)
          echo "### WASM artefacts" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/openswmm_engine.js dist/openswmm_engine.wasm | awk '{printf "- `%s` %.2f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"

      - name: Build TypeScript wrappers
        run: npm ci && npm run build

      - name: Smoke tests (exports, 1D, rain/snow file I/O, and 2D, Node)
        run: npm run smoke

      - name: Upload WASM artefacts
        uses: actions/upload-artifact@v5
        with:
          name: openswmm-wasm
          path: |
            dist/
            tests/_work/smoke.wasm.rpt
            tests/_work/smoke2d.wasm.rpt
          retention-days: 14
