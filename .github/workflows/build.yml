name: Build & Type-Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript type-check and tests (no WASM required)
  # ---------------------------------------------------------------------------
  typecheck:
    name: TypeScript — type-check & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # WASM build via Emscripten Docker image
  # ---------------------------------------------------------------------------
  wasm-build:
    name: WASM — Emscripten build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: emscripten/emsdk:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure with emcmake
        run: |
          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSWMM_BUILD_TESTS=OFF \
            -DOPENSWMM_BUILD_CLI=OFF \
            -DOPENSWMM_BUILD_PYTHON=OFF

      - name: Build WASM module
        run: cmake --build build --parallel

      - name: Verify outputs exist
        run: |
          test -f dist/openswmm_engine.js   || (echo "Missing JS glue"  && exit 1)
          test -f dist/openswmm_engine.wasm || (echo "Missing WASM file" && exit 1)

      - name: Upload WASM artefacts
        uses: actions/upload-artifact@v4
        with:
          name: openswmm-wasm
          path: |
            dist/openswmm_engine.js
            dist/openswmm_engine.wasm
          retention-days: 14
