version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
